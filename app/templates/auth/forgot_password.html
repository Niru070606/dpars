{% extends "loginBase.html" %}

{% block title %}
<title>Forgot Password | D-PARS</title>
{% endblock %}

{% block content %}

<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">

    <div class="card shadow border-0 rounded-4 p-4" style="width: 400px;">

        <div class="text-center mb-4">

            <h1 class="fw-bold text-danger mb-2">
                Forgot Password
            </h1>

            <p class="text-secondary mb-0">
                Enter your registered email to recover your account.
            </p>

        </div>

        <form
            method="POST"
            action="{{ url_for('auth.forgot_password') }}"
        >

            <div class="mb-4">

                <label for="email" class="form-label fw-semibold">
                    Recovery Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control form-control-lg"
                    placeholder="Enter your registered email"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn btn-danger btn-lg w-100 fw-semibold"
            >
                Continue
            </button>

        </form>

        <div class="text-center mt-3">

            <a
                href="{{ url_for('auth.login') }}"
                class="text-danger text-decoration-none small"
            >
                Back to Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
