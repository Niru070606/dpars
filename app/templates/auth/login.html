{% extends "loginBase.html" %}

{% block title %}
<title>Login | D-PARS</title>
{% endblock %}

{% block content %}

<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">

    <div class="card shadow border-0 rounded-4 p-4" style="width: 400px;">

        <div class="text-center mb-4">
            <h1 class="fw-bold text-danger mb-2">
                D-PARS
            </h1>

            <p class="text-secondary mb-0">
                Login to your account
            </p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">

            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">
                    Username or Email Address
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control form-control-lg"
                    placeholder="Enter username or email"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control form-control-lg"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div class="text-end mb-4">
                <a
                    href="{{ url_for('auth.forgot_password') }}"
                    class="text-danger text-decoration-none small"
                >
                    Forgot Password?
                </a>
            </div>

            <button
                type="submit"
                class="btn btn-danger btn-lg w-100 fw-semibold"
            >
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
